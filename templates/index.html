<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Authenticity Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s ease;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">PDF Authenticity Detector</h1>
            
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div id="drop-zone" class="drop-zone rounded-lg p-8 text-center cursor-pointer mb-6">
                    <div class="mb-4">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <p class="text-gray-600 mb-2">Drag and drop your PDF file here</p>
                    <p class="text-gray-500 text-sm">or</p>
                    <label class="mt-2 inline-block">
                        <span class="bg-blue-500 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-blue-600 transition-colors">
                            Browse Files
                        </span>
                        <input type="file" id="file-input" class="hidden" accept=".pdf">
                    </label>
                </div>

                <div id="result" class="hidden">
                    <div class="border-t pt-6">
                        <h2 class="text-xl font-semibold mb-4">Analysis Result</h2>
                        <div id="result-content" class="space-y-4">
                            <!-- Results will be inserted here -->
                        </div>
                    </div>
                </div>

                <div id="loading" class="hidden text-center py-4">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                    <p class="mt-2 text-gray-600">Analyzing PDF...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('result-content');
        const loading = document.getElementById('loading');

        // Drag and drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFileSelect, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.type === 'application/pdf') {
                    uploadFile(file);
                } else {
                    alert('Please upload a PDF file');
                }
            }
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            loading.classList.remove('hidden');
            result.classList.add('hidden');

            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                displayResults(data);
            })
            .catch(error => {
                loading.classList.add('hidden');
                alert('Error analyzing PDF: ' + error);
            });
        }

        function displayResults(data) {
            if (data.error) {
                resultContent.innerHTML = `<div class="text-red-500">${data.error}</div>`;
                return;
            }

            const isOriginal = data.is_original;
            const issues = data.issues_found || [];
            const permissions = data.permissions || {};

            let html = `
                <div class="text-center mb-4">
                    <div class="text-2xl font-bold ${isOriginal ? 'text-green-500' : 'text-red-500'}">
                        ${isOriginal ? 'ORIGINAL' : 'FAKE'}
                    </div>
                </div>
            `;

            if (!isOriginal) {
                html += '<div class="space-y-4">';
                
                if (issues.length > 0) {
                    html += `
                        <div>
                            <h3 class="font-semibold text-gray-700">Issues Found:</h3>
                            <ul class="list-disc list-inside text-gray-600">
                                ${issues.map(issue => `<li>${issue}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                if (Object.keys(permissions).length > 0) {
                    html += `
                        <div>
                            <h3 class="font-semibold text-gray-700">Permissions:</h3>
                            <ul class="list-disc list-inside text-gray-600">
                                ${Object.entries(permissions).map(([key, value]) => 
                                    `<li>${key}: ${value}</li>`
                                ).join('')}
                            </ul>
                        </div>
                    `;
                }

                html += '</div>';
            }

            resultContent.innerHTML = html;
        }
    </script>
</body>
</html>
